# Smoke test: builds the real Docker image, runs it against a real PostgreSQL,
# and walks through the whole account flow like a user would.
# Runs on every push and pull request, or manually from the Actions tab.
name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: smoke-test-only
          POSTGRES_DB: registerapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BASE: http://localhost:8080

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the WAR and run unit tests (same as Jenkins)
        run: mvn -B clean package

      - name: Build the Docker image
        run: docker build -t register-app:smoke .

      - name: Start the app, connected to PostgreSQL
        run: |
          docker run -d --name app --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/registerapp \
            -e DB_USER=app -e DB_PASSWORD=smoke-test-only \
            register-app:smoke

      - name: Wait for Tomcat to start
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$BASE/home.jsp" > /dev/null; then echo "Tomcat is up"; exit 0; fi
            sleep 2
          done
          echo "Tomcat did not start within 60s"; exit 1

      - name: Write test helpers
        run: |
          cat > helpers.sh <<'EOF'
          set -euo pipefail
          # csrf <jar> <url>: load a page and print its CSRF token
          csrf() { curl -s -c "$1" -b "$1" "$2" -o page.html; sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p' page.html | awk 'NR==1'; }
          # has <text> <file>: fail unless the file contains the text
          has() { if ! grep -qF -- "$1" "$2"; then echo "FAIL: expected '$1' in $2"; exit 1; fi; echo "ok: found '$1'"; }
          # status <expected> <actual> <label>
          expect() { if [ "$2" != "$1" ]; then echo "FAIL: $3 (expected HTTP $1, got $2)"; exit 1; fi; echo "ok: $3"; }
          register() { # jar name email password
            local t; t=$(csrf "$1" "$BASE/register")
            curl -s -o out.html -w '%{http_code}' -c "$1" -b "$1" -X POST "$BASE/register" \
              --data-urlencode "csrf=$t" --data-urlencode "name=$2" --data-urlencode "mobile=+237 650 123 456" \
              --data-urlencode "email=$3" --data-urlencode "psw=$4" --data-urlencode "psw-repeat=$4"
          }
          login() { # jar email password
            local t; t=$(csrf "$1" "$BASE/login")
            curl -s -o out.html -w '%{http_code}' -c "$1" -b "$1" -X POST "$BASE/login" \
              --data-urlencode "csrf=$t" --data-urlencode "email=$2" --data-urlencode "psw=$3"
          }
          EOF

      - name: Public pages load
        run: |
          source helpers.sh
          for page in home.jsp about.jsp register login community health; do
            expect 200 "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/$page")" "GET /$page"
          done
          expect 302 "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/register.jsp")" "old /register.jsp redirects"

      - name: Register creates an account and logs the user in
        run: |
          source helpers.sh
          expect 302 "$(register a.jar 'Smoke Test' smoke@example.com password123)" "register"
          curl -s -b a.jar "$BASE/account" -o account.html
          has "Welcome, Smoke" account.html
          curl -s "$BASE/community" -o community.html
          has "Smoke T." community.html

      - name: Log out, then the account page is protected
        run: |
          source helpers.sh
          t=$(csrf a.jar "$BASE/account")
          expect 302 "$(curl -s -o /dev/null -w '%{http_code}' -c a.jar -b a.jar -X POST "$BASE/logout" --data-urlencode "csrf=$t")" "logout"
          expect 302 "$(curl -s -o /dev/null -w '%{http_code}' -b a.jar "$BASE/account")" "account redirects to login when logged out"

      - name: Log in (wrong password rejected, right password works)
        run: |
          source helpers.sh
          expect 401 "$(login b.jar smoke@example.com wrong-password)" "wrong password rejected"
          has "Invalid email or password" out.html
          expect 302 "$(login b.jar SMOKE@example.com password123)" "log in (email is case-insensitive)"
          curl -s -b b.jar "$BASE/account" -o account.html
          has "Welcome, Smoke" account.html

      - name: Duplicate email, bad input and missing CSRF token are rejected
        run: |
          source helpers.sh
          expect 400 "$(register c.jar 'Someone Else' smoke@example.com password123)" "duplicate email"
          has "already exists" out.html
          expect 400 "$(register c.jar 'X' not-an-email short)" "invalid input"
          expect 403 "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/register" --data-urlencode 'name=No Token')" "missing CSRF token"

      - name: Names are HTML-escaped (no XSS)
        run: |
          source helpers.sh
          expect 302 "$(register d.jar '<script>alert(1)</script> X' xss@example.com password123)" "register with script in name"
          curl -s -b d.jar "$BASE/account" -o xss.html
          if grep -q '<script>alert(1)</script>' xss.html; then echo "FAIL: script rendered unescaped"; exit 1; fi
          has '&lt;script&gt;' xss.html

      - name: Delete account (needs the right password)
        run: |
          source helpers.sh
          t=$(csrf b.jar "$BASE/account")
          expect 400 "$(curl -s -o /dev/null -w '%{http_code}' -c b.jar -b b.jar -X POST "$BASE/account/delete" --data-urlencode "csrf=$t" --data-urlencode 'psw=wrong')" "delete with wrong password refused"
          t=$(csrf b.jar "$BASE/account")
          expect 302 "$(curl -s -o /dev/null -w '%{http_code}' -c b.jar -b b.jar -X POST "$BASE/account/delete" --data-urlencode "csrf=$t" --data-urlencode 'psw=password123')" "delete account"
          expect 401 "$(login e.jar smoke@example.com password123)" "deleted account can no longer log in"

      - name: Container logs
        if: always()
        run: docker logs app || true
