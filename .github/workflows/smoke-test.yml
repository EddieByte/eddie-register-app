# Smoke test: builds the real Docker image, starts it, and clicks through the app.
# Runs on every push and pull request, or manually from the Actions tab.
name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the WAR (same command as Jenkins)
        run: mvn -B clean package

      - name: Build the Docker image
        run: docker build -t register-app:smoke .

      - name: Start the container
        run: docker run -d --name app -p 8080:8080 register-app:smoke

      - name: Wait for Tomcat to start
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/home.jsp > /dev/null; then
              echo "Tomcat is up"; exit 0
            fi
            sleep 2
          done
          echo "Tomcat did not start within 60s"; exit 1

      - name: Pages load (home, register, about)
        run: |
          for page in home.jsp register.jsp about.jsp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/$page")
            echo "$page -> HTTP $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Registration form submits successfully
        run: |
          code=$(curl -s -o response.html -w '%{http_code}' -X POST http://localhost:8080/register \
            --data-urlencode 'name=Smoke Test' --data-urlencode 'mobile=123456' \
            --data-urlencode 'email=smoke@example.com' \
            --data-urlencode 'psw=secret' --data-urlencode 'psw-repeat=secret')
          echo "POST /register -> HTTP $code"
          [ "$code" = "200" ] || exit 1
          grep -q "all set, Smoke Test" response.html
          echo "Thank-you page shows the submitted name"

      - name: Submitted name is HTML-escaped (no XSS)
        run: |
          curl -s -X POST http://localhost:8080/register \
            --data-urlencode 'name=<script>alert(1)</script>' -o xss.html
          if grep -q '<script>alert(1)</script>' xss.html; then
            echo "FAIL: script tag was rendered unescaped"; exit 1
          fi
          grep -q '&lt;script&gt;' xss.html
          echo "Script tag was safely escaped"

      - name: Container logs
        if: always()
        run: docker logs app || true